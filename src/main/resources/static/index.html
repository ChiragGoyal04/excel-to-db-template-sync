<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Upload System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Excel Upload System</h1>

    <p class="instruction">
        Upload an Excel file (.xls or .xlsx).<br>
        The system will automatically fetch columns
        and add data in the respective template table.
    </p>

    <form id="uploadForm">

        <input
                type="file"
                id="excelFile"
                accept=".xls,.xlsx"
                required
        >

        <button type="submit">
            Upload File
        </button>

    </form>
    <div id="result"></div>
</div>

<script src="app.js"></script>

</body>
</html>
